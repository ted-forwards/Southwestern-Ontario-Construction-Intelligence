name: Refresh live tenders
on:
  workflow_dispatch:
  schedule:
    - cron: '37 14 * * *'
permissions:
  contents: write
concurrency:
  group: live-tenders
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_tenders.py
      - run: |
          git config user.name "SOCI tender bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-tenders.json
          git diff --cached --quiet || git commit -m "Refresh Ontario tender snapshot"
          git push
